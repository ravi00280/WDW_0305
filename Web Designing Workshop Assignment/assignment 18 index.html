
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18 - Accessible Student Admission Page</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 20px;
        }
        header, footer {
            background-color: #102070;
            color: white;
            text-align: center;
            padding: 15px;
        }
        footer {
            padding: 8px;
            font-size: 13px;
            margin-top: 20px;
        }
        main {
            max-width: 650px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        caption {
            font-weight: bold;
            margin-bottom: 5px;
        }
        th, td {
            border: 1px solid #888;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background-color: #e6e8f0;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
