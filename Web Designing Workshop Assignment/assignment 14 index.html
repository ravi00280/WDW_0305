
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 14 - Nested and Responsive Tables</title>
    <style>
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <div class="table-wrapper">
        <table>
            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Friday</td>
                <td><!-- Nested table will be added in Part 2 --></td>
                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>
            </tr>
        </table>
    </div>

</body>
</html>
